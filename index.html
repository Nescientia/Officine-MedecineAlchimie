<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Officine - Gestion RP</title>
<style>
:root{
--bg:#0b0907; --pan:#17120e; --pan2:#1f1811; --line:#3a2d20; --line2:#4d3c2a;
--tx:#efe4d4; --tx2:#a8977f; --or:#e8821e; --or2:#ffa447;
--vert:#5aa457; --viol:#9a6fd0; --bleu:#4f8fc0; --rouge:#c8553d; --jaune:#d4a72c; --gris:#7a6b58; --cyan:#4fb3a8;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--tx);font:13px/1.45 "Segoe UI",system-ui,sans-serif;display:flex;height:100vh;overflow:hidden}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}::-webkit-scrollbar-thumb:hover{background:var(--line2)}

nav{width:186px;flex-shrink:0;background:var(--pan);border-right:1px solid var(--line);display:flex;flex-direction:column}
nav h1{font-size:14px;padding:14px 12px 4px;color:var(--or);letter-spacing:.5px}
nav .sub{font-size:10px;color:var(--tx2);padding:0 12px 12px;border-bottom:1px solid var(--line)}
nav .nx{flex:1;overflow-y:auto;padding:6px 0}
nav a{display:flex;align-items:center;gap:8px;padding:7px 12px;color:var(--tx2);cursor:pointer;font-size:12.5px;border-left:2px solid transparent}
nav a:hover{background:var(--pan2);color:var(--tx)}
nav a.on{background:var(--pan2);color:var(--or2);border-left-color:var(--or)}
nav a i{font-style:normal;width:16px;text-align:center;font-size:13px}
nav a b{margin-left:auto;background:var(--or);color:#2a1a08;font-size:9.5px;padding:0 5px;border-radius:8px;font-weight:700}
.navfoot{border-top:1px solid var(--line);padding:7px 12px;font-size:10px;color:var(--gris);display:flex;justify-content:space-between;align-items:center}

main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.top{height:44px;flex-shrink:0;border-bottom:1px solid var(--line);background:var(--pan);display:flex;align-items:center;gap:10px;padding:0 14px}
.top h2{font-size:15px;font-weight:600}
.top .sp{flex:1}
.wrap{flex:1;overflow-y:auto;padding:14px}

.pan{background:var(--pan);border:1px solid var(--line);border-radius:6px}
.pad{padding:12px}
.ph{padding:8px 12px;border-bottom:1px solid var(--line);font-weight:600;font-size:12.5px;display:flex;align-items:center;gap:8px}
.ph .sp{flex:1}
.g{display:grid;gap:10px}
.g2{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(125px,1fr))}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--tx2)}.small{font-size:11px}.tiny{font-size:10px}
.right{text-align:right}.mono{font-variant-numeric:tabular-nums}
.sep{height:1px;background:var(--line);margin:10px 0}

button,.btn{background:var(--pan2);color:var(--tx);border:1px solid var(--line2);border-radius:5px;padding:5px 11px;font:inherit;font-size:12px;cursor:pointer;white-space:nowrap}
button:hover{background:#2b2118;border-color:var(--or)}
button:disabled{opacity:.35;cursor:not-allowed}
.b-or{background:var(--or);border-color:var(--or);color:#2a1a08;font-weight:600}.b-or:hover{background:var(--or2);border-color:var(--or2)}
.b-v{background:#1e3a1d;border-color:#3d6b3b;color:#a9d6a6}.b-v:hover{background:#264924;border-color:var(--vert)}
.b-r{background:#3a1c16;border-color:#6b342a;color:#e0a99c}.b-r:hover{background:#4a241c;border-color:var(--rouge)}
.b-s{padding:2px 7px;font-size:11px}
.b-i{padding:3px 7px;font-size:12px;line-height:1}

input,select,textarea{background:#100c08;color:var(--tx);border:1px solid var(--line);border-radius:5px;padding:6px 8px;font:inherit;font-size:12.5px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--or)}
input[readonly]{background:#0a0806;color:var(--tx2)}
textarea{resize:vertical;line-height:1.5}
label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--tx2);margin-bottom:3px;font-weight:600}
.f{margin-bottom:9px}
.chk{display:flex;align-items:center;gap:7px;cursor:pointer;font-size:12px}
.chk input{width:15px;height:15px;flex:0 0 auto;accent-color:var(--or)}

table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:6px 8px;color:var(--tx2);font-size:10px;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:5px 8px;border-bottom:1px solid #241c14;vertical-align:middle}
tbody tr:hover{background:#1c1610}
tr.clk{cursor:pointer}
.empty{padding:26px;text-align:center;color:var(--gris);font-size:12px}

.tag{display:inline-block;padding:1px 7px;border-radius:9px;font-size:10px;font-weight:600;border:1px solid;white-space:nowrap}
.t-ing{color:var(--vert);border-color:#3d6b3b;background:#16240f}
.t-pot{color:var(--viol);border-color:#5b4080;background:#1d1529}
.t-breuv{color:var(--cyan);border-color:#2f6b64;background:#0e2321}
.t-nour{color:var(--jaune);border-color:#6d5518;background:#241d0d}
.t-comp{color:var(--bleu);border-color:#2f5c7d;background:#0f1d28}
.t-mat{color:var(--rouge);border-color:#6b342a;background:#26120e}
.t-autre{color:var(--gris);border-color:#4a4034;background:#1a1712}
.t-ok{color:var(--vert);border-color:#3d6b3b;background:#16240f}
.t-w{color:var(--jaune);border-color:#6d5518;background:#241d0d}
.t-d{color:var(--rouge);border-color:#6b342a;background:#26120e}
.t-n{color:var(--tx2);border-color:var(--line2);background:var(--pan2)}
.t-b{color:var(--bleu);border-color:#2f5c7d;background:#0f1d28}

.kpi{background:var(--pan);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.kpi .k{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--tx2);font-weight:600}
.kpi .v{font-size:21px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}

.ov{position:fixed;inset:0;background:rgba(0,0,0,.66);z-index:60;display:none}
.ov.on{display:block}
.dr{position:fixed;top:0;right:0;bottom:0;width:490px;max-width:94vw;background:var(--pan);border-left:1px solid var(--line2);z-index:61;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .17s ease}
.dr.on{transform:none}
.dr .dh{padding:11px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex-shrink:0}
.dr .dh h3{font-size:14px;flex:1}
.dr .db{flex:1;overflow-y:auto;padding:14px}
.dr .df{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:8px;flex-shrink:0;background:var(--pan2)}
.md{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:840px;max-width:95vw;max-height:90vh;background:var(--pan);border:1px solid var(--line2);border-radius:8px;z-index:61;display:none;flex-direction:column}
.md.on{display:flex}
.md .dh{padding:11px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.md .dh h3{font-size:14px;flex:1}
.md .db{flex:1;overflow-y:auto;padding:14px}
.md .df{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:8px;background:var(--pan2)}

.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--pan2);border:1px solid var(--or);color:var(--tx);padding:9px 16px;border-radius:6px;z-index:90;font-size:12.5px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}

.lines{display:grid;grid-template-columns:1fr 66px 86px 66px 84px 30px;gap:6px;align-items:center}
.lines .hd{font-size:9.5px;text-transform:uppercase;color:var(--tx2);font-weight:600;letter-spacing:.3px}
.bar{height:5px;background:#241c14;border-radius:3px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--or)}

.fiche{background:var(--pan2);border:1px solid var(--line);border-radius:5px;padding:9px;margin-bottom:8px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:7px;margin-top:7px}
.kv div span{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.3px;color:var(--tx2);font-weight:600}
.kv div b{font-size:14px;font-variant-numeric:tabular-nums}
.tl{border-left:2px solid var(--line2);margin-left:6px;padding-left:12px}
.tl .it{position:relative;padding-bottom:12px}
.tl .it:before{content:'';position:absolute;left:-17px;top:4px;width:8px;height:8px;border-radius:50%;background:var(--or);border:2px solid var(--pan)}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:12px;flex-wrap:wrap}
.tabs span{padding:6px 12px;cursor:pointer;font-size:12px;color:var(--tx2);border-bottom:2px solid transparent;font-weight:600}
.tabs span:hover{color:var(--tx)}
.tabs span.on{color:var(--or2);border-bottom-color:var(--or)}

.pxc{display:flex;gap:3px;align-items:center;justify-content:flex-end;flex-wrap:nowrap}
.pxc input{width:64px;text-align:right;padding:3px 5px}

#print{display:none}
@media print{
 body>*{display:none!important}
 #print{display:block!important;position:static;background:#fff;color:#000;padding:26px;font-family:Georgia,serif}
 #print h1{font-size:21px;border-bottom:2px solid #000;padding-bottom:7px;margin-bottom:12px}
 #print table{width:100%;border-collapse:collapse;margin:12px 0;font-size:13px}
 #print th,#print td{border:1px solid #666;padding:5px 7px;text-align:left}
 #print .tot{text-align:right;font-size:16px;font-weight:bold;margin-top:12px}
 #print .mt{font-size:12px;color:#444}
}
/* ═══════════ AUTHENTIFICATION SUPABASE / DISCORD ═══════════ */
body.auth-lock nav,body.auth-lock main{visibility:hidden}
.auth-gate{position:fixed;inset:0;z-index:200;background:radial-gradient(circle at 50% 35%,#1f1811 0,#0b0907 55%);display:flex;align-items:center;justify-content:center;padding:24px}
.auth-gate.off{display:none}
.auth-card{width:430px;max-width:94vw;background:var(--pan);border:1px solid var(--line2);border-radius:10px;padding:24px;box-shadow:0 18px 60px rgba(0,0,0,.45)}
.auth-card h1{color:var(--or2);font-size:20px;margin-bottom:6px}
.auth-card p{color:var(--tx2);margin:7px 0 14px}
.auth-logo{font-size:30px;margin-bottom:8px}
.auth-status{padding:10px 12px;border:1px solid var(--line);background:var(--pan2);border-radius:6px;margin:12px 0;font-size:12px}
.auth-status.wait{border-color:var(--jaune);color:#e8cf7b}
.auth-status.err{border-color:var(--rouge);color:#e0a99c}
.auth-user{display:flex;align-items:center;gap:8px;color:var(--tx2);font-size:11px}
.auth-user img{width:24px;height:24px;border-radius:50%;object-fit:cover;border:1px solid var(--line2)}
.auth-role{color:var(--or2);font-size:10px}

</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ═══════════ 0. AUTHENTIFICATION SUPABASE / DISCORD ═══════════ */
const SUPABASE_URL='https://iwzluljlgidtgjeujpdd.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_WRsUV18uUiM9FMylSNXKHw_-qOE43jv';
const SITE_URL='https://nescientia.github.io/Officine-MedecineAlchimie/';
const SB=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{
  auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}
});
let CURRENT_SESSION=null,CURRENT_PROFILE=null;

function authGate(title,msg,kind,actions){
  const gate=document.getElementById('authGate');
  document.getElementById('authText').textContent=title||'';
  const st=document.getElementById('authState');
  st.className='auth-status'+(kind?' '+kind:'');
  st.innerHTML=msg||'';
  document.getElementById('authActions').innerHTML=actions||'';
  gate.classList.remove('off');
  document.body.classList.add('auth-lock');
}
function authOpenApp(){
  document.getElementById('authGate').classList.add('off');
  document.body.classList.remove('auth-lock');
  const p=CURRENT_PROFILE||{};
  const avatar=p.avatar_url?'<img src="'+esc(p.avatar_url)+'" alt="">':'';
  document.getElementById('authBar').innerHTML=avatar+'<span><b>'+esc(p.nom_affiche||'Utilisateur')+'</b><br><span class="auth-role">'+esc(p.role||'')+'</span></span><button class="b-s" onclick="signOutDiscord()">Déconnexion</button>';
}
async function signInDiscord(){
  authGate('Connexion Discord','Redirection vers Discord...','','');
  const {error}=await SB.auth.signInWithOAuth({provider:'discord',options:{redirectTo:SITE_URL}});
  if(error)authGate('Connexion impossible',esc(error.message),'err','<button class="b-or" onclick="signInDiscord()">Réessayer</button>');
}
async function signOutDiscord(){
  await SB.auth.signOut();
  location.href=SITE_URL;
}
async function fetchMyProfile(userId){
  const {data,error}=await SB.from('profiles').select('user_id,discord_id,nom_affiche,avatar_url,role,actif').eq('user_id',userId).maybeSingle();
  if(error)throw error;
  return data;
}
async function authBoot(){
  try{
    const {data:{session},error}=await SB.auth.getSession();
    if(error)throw error;
    CURRENT_SESSION=session;
    if(!session){
      authGate('Connexion requise',"Utilisez votre compte Discord pour accéder à l'Officine.",'', '<button class="b-or" onclick="signInDiscord()">Se connecter avec Discord</button>');
      return false;
    }
    CURRENT_PROFILE=await fetchMyProfile(session.user.id);
    if(!CURRENT_PROFILE){
      authGate('Profil introuvable',"Votre compte Discord est authentifié, mais aucun profil Officine n'a été créé.",'err','<button onclick="signOutDiscord()">Déconnexion</button>');
      return false;
    }
    if(!CURRENT_PROFILE.actif){
      const who=esc(CURRENT_PROFILE.nom_affiche||session.user.user_metadata?.full_name||'Compte Discord');
      authGate('Accès en attente','<b>'+who+'</b><br>Votre compte est bien identifié. Un administrateur doit maintenant autoriser votre accès.','wait','<button onclick="signOutDiscord()">Déconnexion</button>');
      return false;
    }
    authOpenApp();
    return true;
  }catch(e){
    console.error(e);
    authGate("Erreur d'authentification",esc(e&&e.message?e.message:String(e)),'err','<button class="b-or" onclick="location.reload()">Réessayer</button>');
    return false;
  }
}

/* ═══════════ 1. PERSISTANCE ═══════════ */
const KEY='officine_keizaal_v1';
const Store={
  async get(k){
    try{ if(window.storage){const r=await window.storage.get(k); return r?r.value:null;} }catch(e){}
    try{ return window.localStorage.getItem(k); }catch(e){ return null; }
  },
  async set(k,v){
    try{ if(window.storage){ await window.storage.set(k,v); return true; } }catch(e){}
    try{ window.localStorage.setItem(k,v); return true; }catch(e){ return false; }
  }
};
let DB=null, saveT=null;
function save(){
  clearTimeout(saveT);
  document.getElementById('saveSt').textContent='…';
  saveT=setTimeout(async()=>{
    DB.savedAt=Date.now();
    await Store.set(KEY,JSON.stringify(DB));
    document.getElementById('saveSt').textContent='enregistré';
  },250);
}

/* ═══════════ 2. MODELE + MIGRATION ═══════════ */
const FAM=['Ingrédient','Potion','Breuvage','Nourriture','Composant','Matériel médical','Autre'];
const FCL={'Ingrédient':'t-ing','Potion':'t-pot','Breuvage':'t-breuv','Nourriture':'t-nour','Composant':'t-comp','Matériel médical':'t-mat','Autre':'t-autre'};
const MVT=['Ajout','Retrait','Vente','Consommation','Production','Achat','Correction','Don','Perte'];
const BIN='stock';
const INVST=['Brouillon','À payer','Partiellement payé','Payé','Annulé'];
const ORDST=['Demande','Acceptée','En préparation','Prête','Livrée','Annulée'];
const JTYPE=['Vente','Consultation','Stock','Production','Facturation','Achat','Commande','Patient','Système'];

function uid(p){return p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

function blank(){
  return {version:4,savedAt:0,
    settings:{currency:'septims',consultPrice:20,practitioner:'',addProductsToConsult:true,orgName:'Officine de Keizaal',nextInv:1,nextOrd:1,nextPur:1,nextAte:1,priceStep:0.05,treasuryInit:0},
    products:[],stock:{},movements:[],patients:[],consultations:[],invoices:[],orders:[],purchases:[],journal:[],cart:[],atelier:[]};
}

function migrate(d){
  const b=blank();
  if(!d||typeof d!=='object') return seed(b);
  const o=Object.assign(b,d);
  o.settings=Object.assign(b.settings,d.settings||{});
  ['products','movements','patients','consultations','invoices','orders','purchases','journal','cart','atelier'].forEach(k=>{ if(!Array.isArray(o[k])) o[k]=[]; });
  if(!o.stock||typeof o.stock!=='object') o.stock={};
  if(!o.settings.nextAte)o.settings.nextAte=1;
  o.consultations.forEach(c=>{ if(!Array.isArray(c.prescriptions))c.prescriptions=[]; });
  o.invoices.forEach(i=>{
    if(!Array.isArray(i.payments)){
      i.payments=[];
      if(num(i.paidAmount)>0)i.payments.push({id:uid('pay'),amount:num(i.paidAmount),ts:i.ts||Date.now(),note:'Solde initial (migration)'});
    }
    delete i.paidAmount;
  });

  o.products.forEach(p=>{
    if(!p.id) p.id=uid('p');
    if(p.sellable===undefined) p.sellable=true;
    if(p.active===undefined) p.active=true;
    if(!Array.isArray(p.recipe)) p.recipe=[];
    ['value','buyPrice','sellPrice','weight','threshold','lot'].forEach(k=>{ p[k]=num(p[k]); });
    if(!p.lot) p.lot=1;
    if(!FAM.includes(p.family)) p.family='Autre';
  });

  const old=(d.version||0)<3;
  Object.keys(o.stock).forEach(pid=>{
    const v=o.stock[pid];
    if(typeof v==='number'){ o.stock[pid]={[BIN]:num(v)}; return; }
    if(v&&typeof v==='object'){
      let tot=0; Object.keys(v).forEach(L=>{ tot+=num(v[L]); });
      o.stock[pid]={[BIN]:tot};
    }else o.stock[pid]={[BIN]:0};
  });
  o.products.forEach(p=>{ if(!o.stock[p.id]) o.stock[p.id]={[BIN]:0}; });
  if(old&&o.movements.length) o.movements.forEach(m=>{ if(m.loc&&m.loc!==BIN) m.reason=(m.reason?m.reason+' ':'')+'['+m.loc+']'; });

  o.version=3;
  if(!o.products.length) seed(o);
  return o;
}

function seed(o){
  const mk=(name,family,opt)=>{const p=Object.assign({id:uid('p'),name,family,category:'',weight:0,value:0,buyPrice:0,sellPrice:0,lot:1,sellable:true,active:true,threshold:0,notes:'',recipe:[],archived:false},opt||{});o.products.push(p);return p;};
  const ail=mk('Ail','Ingrédient',{weight:.25,value:1,buyPrice:.5,sellPrice:1,threshold:50});
  const sel=mk('Tas de sel','Ingrédient',{weight:.2,value:2,buyPrice:1,sellPrice:2,threshold:30});
  const suc=mk('Sucrelune','Ingrédient',{weight:.2,value:5,buyPrice:3,sellPrice:6,threshold:20});
  const lyr=mk('Lys rouge','Ingrédient',{weight:.1,value:3,buyPrice:1.5,sellPrice:3,threshold:20});
  const lyv=mk('Lys violet','Ingrédient',{weight:.1,value:3,buyPrice:1.5,sellPrice:3,threshold:20});
  const lgd=mk('Langue de dragon','Ingrédient',{weight:.1,value:15,buyPrice:8,sellPrice:16,threshold:10});
  const chd=mk('Chardon','Ingrédient',{weight:.1,value:1,buyPrice:.5,sellPrice:1,threshold:20});

/* ═══════════ 3. HELPERS ═══════════ */
function num(v){const n=parseFloat(String(v==null?0:v).replace(',','.'));return isFinite(n)?n:0;}
function fmt(n){return num(n).toLocaleString('fr-FR',{maximumFractionDigits:2});}
function sp(n){return fmt(n)+' '+DB.settings.currency;}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function dt(ts){const d=new Date(ts);return d.toLocaleDateString('fr-FR')+' à '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});}
function dOnly(ts){return new Date(ts).toLocaleDateString('fr-FR');}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2100);}
function ask(m){return confirm(m);}
function P(id){return DB.products.find(p=>p.id===id);}
function PN(id){const p=P(id);return p?p.name:'(produit supprimé)';}
function PAT(id){return DB.patients.find(p=>p.id===id);}
function patName(id){const p=PAT(id);return p?p.name:'—';}

function qty(pid){const s=DB.stock[pid];if(!s)return 0;return num(s[BIN]);}
function stVal(pid){const p=P(pid);return p?qty(pid)*num(p.value):0;}
function stStatus(pid){const p=P(pid),q=qty(pid);if(!p)return'';if(q<=0)return'rupture';if(p.threshold>0&&q<=p.threshold)return'faible';return'ok';}
function stateTag(p){
  if(p.archived)return '<span class="tag t-n">Archivé</span>';
  const q=qty(p.id);
  if(q<=0)return '<span class="tag t-d">Rupture</span>';
  if(p.threshold>0&&q<=p.threshold)return '<span class="tag t-w">Stock faible</span>';
  return (p.sellable&&p.active)?'<span class="tag t-ok">En vente</span>':'<span class="tag t-n">Hors vente</span>';
}

function mv(pid,delta,type,reason,ref){
  if(!DB.stock[pid])DB.stock[pid]={[BIN]:0};
  DB.stock[pid][BIN]=num(DB.stock[pid][BIN])+num(delta);
  DB.movements.unshift({id:uid('m'),ts:Date.now(),pid,qty:num(delta),type:type||'Correction',reason:reason||'',ref:ref||''});
  if(DB.movements.length>4000)DB.movements.length=4000;
}
function take(pid,q,type,reason,ref){ mv(pid,-Math.abs(num(q)),type,reason,ref); }
function jr(type,text,amount,ref){
  DB.journal.unshift({id:uid('j'),ts:Date.now(),type,text,amount:num(amount),ref:ref||''});
  if(DB.journal.length>3000)DB.journal.length=3000;
}

function usedIn(pid){
  const r=[];
  DB.products.forEach(p=>{(p.recipe||[]).forEach(l=>{if(l.pid===pid)r.push({p,qty:l.qty});});});
  return r;
}
function needs(pid,n){
  const p=P(pid);if(!p||!p.recipe.length)return[];
  return p.recipe.map(l=>{const need=num(l.qty)*n,av=qty(l.pid);return{pid:l.pid,name:PN(l.pid),need,av,miss:Math.max(0,need-av)};});
}
function invTotal(inv){return (inv.lines||[]).reduce((a,l)=>a+lineTotal(l),0);}
function lineTotal(l){return Math.max(0,num(l.qty)*num(l.unit)-num(l.discount));}
function invStatusTag(s){
  const m={'Payé':'t-ok','À payer':'t-w','Partiellement payé':'t-b','Annulé':'t-d','Brouillon':'t-n'};
  return '<span class="tag '+(m[s]||'t-n')+'">'+esc(s)+'</span>';
}
function ordStatusTag(s){
  const m={'Livrée':'t-ok','Prête':'t-b','En préparation':'t-w','Acceptée':'t-b','Annulée':'t-d','Demande':'t-n'};
  return '<span class="tag '+(m[s]||'t-n')+'">'+esc(s)+'</span>';
}

const ATE_ST=['En attente','En cours','Terminé','Impossible','Annulée'];
function invPaid(inv){return (inv.payments||[]).reduce((a,p)=>a+num(p.amount),0);}
function invRemain(inv){return Math.max(0,invTotal(inv)-invPaid(inv));}
function invRecalcStatus(inv){
  if(inv.status==='Annulé'||inv.status==='Brouillon')return;
  const t=invTotal(inv),paid=invPaid(inv);
  if(paid<=0)inv.status='À payer';else if(paid<t)inv.status='Partiellement payé';else inv.status='Payé';
}
function patientInvoices(pid){return DB.invoices.filter(i=>i.patientId===pid&&i.status!=='Annulé');}
function patientDue(pid){return patientInvoices(pid).reduce((a,i)=>a+invRemain(i),0);}
function toutesFacturesDues(){return DB.invoices.filter(i=>i.status!=='Annulé'&&invRemain(i)>0);}
function craftEngine(pid,n,opts){
  opts=opts||{};
  const rows=needs(pid,n),miss=rows.filter(r=>r.miss>0);
  if(miss.length&&!opts.force)return{ok:false,rows,miss};
  const cost=rows.reduce((a,r)=>{const ip=P(r.pid);return a+(ip?num(ip.buyPrice):0)*r.need;},0);
  rows.forEach(r=>take(r.pid,r.need,'Production',(opts.reason||'production')+' — '+PN(pid),opts.refId));
  mv(pid,n,'Production',opts.reason||('fabrication'+(opts.source?' ('+opts.source+')':'')),opts.refId);
  jr('Production',PN(pid)+' ×'+fmt(n)+(opts.source?' — '+opts.source:''),cost,'product',pid);
  return{ok:true,rows,cost};
}
function openRef(kind,id){
  if(!kind||!id)return;
  if(kind==='invoice'&&DB.invoices.find(x=>x.id===id))editInv(id);
  else if(kind==='order'&&DB.orders.find(x=>x.id===id))editOrder(id);
  else if(kind==='consult'&&DB.consultations.find(x=>x.id===id))editConsult(id);
  else if(kind==='atelier'&&DB.atelier.find(x=>x.id===id))openAtelier(id);
  else if(kind==='purchase'&&DB.purchases.find(x=>x.id===id))editPurch(id);
  else if(kind==='product'&&P(id))openProd(id);
  else if(kind==='patient'&&PAT(id))openPat(id);
  else toast('Élément introuvable (peut-être supprimé)');
}

function bump(id,d){const e=document.getElementById(id);e.value=fmt(Math.max(0,num(e.value)+d));}
function saveProd(id){
  const name=val('pName').trim();
  if(!name)return toast('Le nom est obligatoire');
  let p=id?P(id):null;
  const isNew=!p;
  if(isNew){p={id:uid('p'),recipe:[],archived:false};DB.products.push(p);DB.stock[p.id]={[BIN]:0};}
  p.name=name;p.family=val('pFam');p.category=val('pCat').trim();
  p.weight=num(val('pW'));p.lot=num(val('pLot'))||1;p.threshold=num(val('pTh'));
  p.sellable=chk('pSell');p.active=chk('pAct');p.notes=val('pNotes');
  const gv=i=>{const e=document.getElementById(i);return e?num(e.value):null;};
  if(isNew){ p.value=gv('pVal0')||0; p.buyPrice=gv('pBuy0')||0; p.sellPrice=gv('pSell0')||0; }
  if(gv('pVal')!==null)p.value=gv('pVal');
  if(gv('pBuy')!==null)p.buyPrice=gv('pBuy');
  if(gv('pSell')!==null)p.sellPrice=gv('pSell');
  if(isNew){
    const q0=gv('pQ0')||0;
    if(q0)mv(p.id,q0,'Ajout','stock initial');
    jr('Système','Création du produit « '+p.name+' »'+(q0?' (stock initial '+fmt(q0)+')':''));
  }else jr('Système','Modification de la fiche « '+p.name+' »');
  closeD();toast('Fiche enregistrée');render();
}
function addToPurchase(pid){
  const p=P(pid);if(!p)return;
  const suggested=Math.max(1,num(p.threshold)-qty(pid))||10;
  closeD();editPurch();
  setTimeout(()=>{
    const box=document.getElementById('puLines');
    box.insertAdjacentHTML('beforeend',purLine({pid:pid,qty:suggested,unit:p.buyPrice}));
    calcPur();
  },50);
}
function archProd(id){
  const p=P(id);
  const hasHist=DB.movements.some(m=>m.pid===id);
  if(!ask('Archiver « '+p.name+' » ?'+(hasHist?'\n\nIl possède un historique : il sera masqué des listes mais conservé intégralement.':'')))return;
  p.archived=true;jr('Système','Archivage de « '+p.name+' »');closeD();toast('Produit archivé');render();
}

/* ═══ Retirer produit : archivage sécurisé ou suppression définitive si aucune dépendance ═══ */
let rmF={q:'',fam:''};
function prodDependencies(pid){
  const list=[];
  const q=qty(pid);if(q>0)list.push(fmt(q)+' en stock');
  const mvN=DB.movements.filter(m=>m.pid===pid).length;if(mvN)list.push(mvN+' mouvement(s)');
  const p=P(pid);
  if(p&&p.recipe&&p.recipe.length)list.push('possède une recette ('+p.recipe.length+' ingrédient(s))');
  const usedN=usedIn(pid).length;if(usedN)list.push('utilisé dans '+usedN+' recette(s)');
  const ordN=DB.orders.filter(o=>(o.lines||[]).some(l=>l.pid===pid)).length;if(ordN)list.push(ordN+' commande(s)');
  const invN=DB.invoices.filter(i=>(i.lines||[]).some(l=>l.pid===pid)).length;if(invN)list.push(invN+' facture(s)');
  const consN=DB.consultations.filter(c=>(c.items||[]).some(it=>it.pid===pid)).length;if(consN)list.push(consN+' consultation(s)');
  const purN=DB.purchases.filter(x=>(x.lines||[]).some(l=>l.pid===pid)).length;if(purN)list.push(purN+' achat(s)');
  const ateN=DB.atelier.filter(o=>o.pid===pid).length;if(ateN)list.push(ateN+' ordre(s) Atelier');
  const jrN=DB.journal.filter(j=>j.refKind==='product'&&j.refId===pid).length;if(jrN)list.push(jrN+' entrée(s) de Journal');
  return {list,qty:q};
}
function openRemoveProduct(){rmF={q:'',fam:''};renderRemoveModal();}
function renderRemoveModal(){
  let l=DB.products.filter(p=>!p.archived);
  if(rmF.q)l=l.filter(p=>p.name.toLowerCase().includes(rmF.q.toLowerCase()));
  if(rmF.fam)l=l.filter(p=>p.family===rmF.fam);
  l.sort((a,b)=>a.name.localeCompare(b.name));
  let b='<div class="row" style="margin-bottom:10px"><input id="rmQ" placeholder="Rechercher…" value="'+esc(rmF.q)+'" style="flex:1" oninput="rmF.q=this.value;renderRemoveModal();document.getElementById(\'rmQ\').focus()">'+
   '<select style="width:160px" onchange="rmF.fam=this.value;renderRemoveModal()"><option value="">Toutes familles</option>'+FAM.map(f=>'<option'+(rmF.fam===f?' selected':'')+'>'+f+'</option>').join('')+'</select></div>';
  b+='<table><thead><tr><th>Produit</th><th>Famille</th><th class="right">Quantité</th><th>Dépendances</th><th class="right">Action</th></tr></thead><tbody>'+
   (l.map(p=>{
     const d=prodDependencies(p.id);
     const dep=d.list.length?d.list.join(', '):'Aucune';
     const act=d.list.length
      ?'<button class="b-s" onclick="archProd(\''+p.id+'\');renderRemoveModal()">Archiver</button>'
      :'<button class="b-s b-r" onclick="confirmDeleteProd(\''+p.id+'\')">Supprimer définitivement</button>';
     return '<tr><td><b>'+esc(p.name)+'</b></td><td><span class="tag '+FCL[p.family]+'">'+esc(p.family)+'</span></td>'+
     '<td class="right mono">'+fmt(qty(p.id))+'</td><td class="tiny muted">'+esc(dep)+'</td><td class="right">'+act+'</td></tr>';
   }).join('')||'<tr><td colspan="5" class="empty">Aucun produit</td></tr>')+'</tbody></table>';
  openM('- Retirer un produit',b,'<button onclick="closeM()">Fermer</button>',780);
}
function confirmDeleteProd(id){
  const p=P(id);if(!p)return;
  const q=qty(id);
  if(!ask('Supprimer définitivement « '+p.name+' » ?\n\nQuantité restante : '+fmt(q)+'\nAucune dépendance trouvée (stock, recette, mouvement, commande, facture, consultation, achat, Atelier, Journal).\n\nCette action est irréversible.'))return;
  delete DB.stock[id];
  DB.products=DB.products.filter(x=>x.id!==id);
  jr('Système','Suppression définitive du produit « '+p.name+' »');
  toast('Produit supprimé');
  renderRemoveModal();render();
}

function openAdjust(pid,sign){
  const b='<div class="f"><label>Produit</label><select id="aP" onchange="prevAdjust()">'+prodOpts(pid)+'</select></div>'+
   '<div class="g g2"><div class="f"><label>Type de mouvement</label><select id="aT">'+opts(MVT,sign<0?'Retrait':'Ajout')+'</select></div>'+
   '<div class="f"><label>Quantité</label><input id="aQ" value="'+(sign<0?'-1':'1')+'" oninput="prevAdjust()"></div></div>'+
   '<div class="f"><label>Motif (facultatif)</label><input id="aR" placeholder="ex. récolte, casse, don…"></div>'+
   '<div class="fiche" id="aPrev"></div>'+
   '<div class="small muted">Une quantité négative retire du stock. Chaque validation crée une ligne d\'historique : le stock n\'est jamais modifié silencieusement.</div>';
  openM('± Mouvement de stock',b,'<button class="b-or" onclick="doAdjust()">Valider le mouvement</button><button onclick="closeM()">Annuler</button>',540);
  prevAdjust();
}
function prevAdjust(){
  const e=document.getElementById('aPrev');if(!e)return;
  const pid=val('aP'),q=num(val('aQ'));
  if(!pid){e.innerHTML='<span class="muted small">Choisissez un produit.</span>';return;}
  const cur=qty(pid),next=cur+q;
  e.innerHTML='<div class="row" style="justify-content:space-between"><span>'+esc(PN(pid))+'</span>'+
   '<b class="mono">'+fmt(cur)+' → <span style="color:'+(next<0?'var(--rouge)':'var(--or2)')+'">'+fmt(next)+'</span></b></div>'+
   (next<0?'<div class="tiny" style="color:var(--rouge);margin-top:4px">Le stock deviendrait négatif.</div>':'');
}
function doAdjust(){
  const pid=val('aP'),q=num(val('aQ'));
  if(!pid||!q)return toast('Produit et quantité requis');
  if(Math.abs(q)>=500&&!ask('Mouvement de '+fmt(q)+' unités sur « '+PN(pid)+' ». Confirmer ?'))return;
  if(qty(pid)+q<0&&!ask('Le stock deviendrait négatif ('+fmt(qty(pid)+q)+'). Continuer ?'))return;
  const before=qty(pid);
  mv(pid,q,val('aT'),val('aR'));
  jr('Stock',PN(pid)+' : '+fmt(before)+' → '+fmt(qty(pid))+' ('+val('aT')+(val('aR')?' — '+val('aR'):'')+')');
  closeM();closeD();toast('Mouvement enregistré');render();
}

/* ═══════════ 8. TARIFS ═══════════ */
let txF={q:'',fam:''};
function vTarifs(){
  document.getElementById('topAct').innerHTML='<button onclick="go(\'stock\')">📦 Ouvrir le stock</button>';
  let l=DB.products.filter(p=>!p.archived);
  if(txF.q)l=l.filter(p=>p.name.toLowerCase().includes(txF.q.toLowerCase()));
  if(txF.fam)l=l.filter(p=>p.family===txF.fam);
  l.sort((a,b)=>a.family.localeCompare(b.family)||a.name.localeCompare(b.name));
  const step=num(DB.settings.priceStep)||0.05;
  const allP=DB.products.filter(x=>!x.archived);
  const stockValTot=allP.reduce((a,p)=>a+qty(p.id)*num(p.value),0);
  const coutAchatTot=allP.reduce((a,p)=>a+qty(p.id)*num(p.buyPrice),0);
  const valVenteTot=allP.reduce((a,p)=>a+qty(p.id)*num(p.sellPrice),0);
  const margePot=valVenteTot-coutAchatTot;
  const kpi=(k,v,c)=>'<div class="kpi"><div class="k">'+k+'</div><div class="v" style="'+(c?'color:'+c:'')+'">'+v+'</div></div>';
  let h='<div class="g g4" style="margin-bottom:10px">'+
   kpi('Valeur totale du stock',fmt(stockValTot))+
   kpi('Coût total d\'achat théorique',fmt(coutAchatTot))+
   kpi('Valeur potentielle de vente',fmt(valVenteTot))+
   kpi('Marge potentielle théorique',fmt(margePot),margePot>=0?'var(--vert)':'var(--rouge)')+
   '</div>';
  h+='<div class="pan pad row" style="margin-bottom:10px">'+
   '<input id="tq" placeholder="Rechercher…" value="'+esc(txF.q)+'" style="flex:1;min-width:170px" oninput="txF.q=this.value;vTarifs();document.getElementById(\'tq\').focus()">'+
   '<select style="width:155px" onchange="txF.fam=this.value;vTarifs()"><option value="">Toutes familles</option>'+FAM.map(f=>'<option'+(txF.fam===f?' selected':'')+'>'+f+'</option>').join('')+'</select>'+
   '<span class="muted small">Pas d\'incrément</span>'+
   '<select style="width:80px" onchange="DB.settings.priceStep=num(this.value);save();vTarifs()">'+
    [0.05,0.1,0.2,0.25,0.5,1,5,10].map(s=>'<option value="'+s+'"'+(step===s?' selected':'')+'>'+fmt(s)+'</option>').join('')+'</select>'+
   '<div style="flex:1"></div><span class="muted small">'+l.length+' référence(s) — même fiche que le stock</span></div>';
  h+='<div class="pan"><div class="ph">🏷 Tarifs<div class="sp"></div><span class="tiny muted">Modifier un prix ne touche jamais à la quantité. Les valeurs ci-dessus sont théoriques, pas le chiffre d\'affaires réellement encaissé.</span></div>'+
   '<table><thead><tr><th>Produit</th><th>Famille</th><th class="right">Qté</th><th class="right" style="width:145px">Valeur</th><th class="right" style="width:145px">Prix achat</th><th class="right" style="width:145px">Prix vente</th><th class="right">Marge</th><th class="right">Marge %</th></tr></thead><tbody>';
  h+=l.map(p=>{
    const marge=num(p.sellPrice)-num(p.buyPrice);
    const margePct=num(p.buyPrice)>0?(marge/num(p.buyPrice)*100):null;
    const cell=(f)=>'<td class="right"><div class="pxc">'+
      '<button class="b-i" onclick="txAdj(\''+p.id+'\',\''+f+'\',-'+step+')">−</button>'+
      '<input value="'+fmt(p[f])+'" onchange="txSet(\''+p.id+'\',\''+f+'\',this.value)">'+
      '<button class="b-i" onclick="txAdj(\''+p.id+'\',\''+f+'\','+step+')">+</button></div></td>';
    return '<tr><td class="clk" onclick="openProd(\''+p.id+'\')"><b>'+esc(p.name)+'</b></td>'+
    '<td><span class="tag '+FCL[p.family]+'">'+esc(p.family)+'</span></td>'+
    '<td class="right mono muted">'+fmt(qty(p.id))+'</td>'+
    cell('value')+cell('buyPrice')+cell('sellPrice')+
    '<td class="right mono" style="color:'+(marge>0?'var(--vert)':marge<0?'var(--rouge)':'var(--tx2)')+'">'+(marge?fmt(marge):'—')+'</td>'+
    '<td class="right mono muted small">'+(margePct===null?'Non calculable':fmt(margePct)+' %')+'</td></tr>';
  }).join('')||'<tr><td colspan="8" class="empty">Aucun produit</td></tr>';
  h+='</tbody></table></div>';
  document.getElementById('view').innerHTML=h;
}
function txSet(pid,field,v){const p=P(pid);if(!p)return;p[field]=Math.max(0,num(v));save();vTarifs();}
function txAdj(pid,field,d){const p=P(pid);if(!p)return;p[field]=Math.max(0,num(p[field])+num(d));save();vTarifs();}

function vRecipes(){
  document.getElementById('topAct').innerHTML='<button class="b-or" onclick="openProduce()">⚗ Lancer une production</button>';
  const l=DB.products.filter(p=>!p.archived&&p.recipe.length);
  let h='<div class="g g2">';

   (l.map(p=>{
     const mx=Math.min.apply(null,p.recipe.map(r=>Math.floor(qty(r.pid)/num(r.qty))).concat([9999]));
     return '<tr class="clk" onclick="openProd(\''+p.id+'\')"><td><b>'+esc(p.name)+'</b><div class="tiny muted">'+p.recipe.map(r=>esc(PN(r.pid))+' ×'+fmt(r.qty)).join(', ')+'</div></td>'+
     '<td class="right mono muted">'+fmt(qty(p.id))+'</td><td class="right mono" style="color:'+(mx>0?'var(--vert)':'var(--rouge)')+'"><b>'+(mx===9999?'∞':mx)+'</b></td>'+
     '<td class="right"><button class="b-s b-or" onclick="event.stopPropagation();openProduce(\''+p.id+'\')">Produire</button> <button class="b-s" onclick="event.stopPropagation();sendToAtelier(\''+p.id+'\')">Envoyer à l\'Atelier</button></td></tr>';
   }).join('')||'<tr><td colspan="4" class="empty">Aucune recette définie</td></tr>')+'</tbody></table></div>';

function ingUsage(){
  const m={};
  DB.products.forEach(p=>p.recipe.forEach(r=>{m[r.pid]=(m[r.pid]||0)+1;}));
  const l=Object.keys(m).sort((a,b)=>m[b]-m[a]);
  if(!l.length)return'<div class="empty">—</div>';
  return '<table><tbody>'+l.map(pid=>'<tr class="clk" onclick="openProd(\''+pid+'\')"><td>'+esc(PN(pid))+'</td><td class="tiny muted">'+m[pid]+' recette(s)</td><td class="right mono" style="color:'+(qty(pid)>0?'var(--tx)':'var(--rouge)')+'">'+fmt(qty(pid))+'</td></tr>').join('')+'</tbody></table>';

function openProduce(pid){
  const n=pid&&document.getElementById('prodN')?num(document.getElementById('prodN').value)||1:1;
  const b='<div class="g g2"><div class="f"><label>Produit à fabriquer</label><select id="fP" onchange="calcProd()">'+
    '<option value="">— choisir —</option>'+DB.products.filter(p=>!p.archived&&p.recipe.length).map(p=>'<option value="'+p.id+'"'+(p.id===pid?' selected':'')+'>'+esc(p.name)+'</option>').join('')+'</select></div>'+
    '<div class="f"><label>Quantité à produire</label><input id="fN" value="'+n+'" oninput="calcProd()"></div></div>'+
    '<div id="fCalc"></div>';
  openM('⚗ Production',b,'<button class="b-or" id="fBtn" onclick="doProduce()">Lancer la production</button><button onclick="closeM()">Annuler</button>',620);
  calcProd();
}
function calcProd(){
  const pid=val('fP'),n=Math.max(0,num(val('fN')));
  const box=document.getElementById('fCalc');if(!box)return;
  if(!pid||!n){box.innerHTML='<div class="empty">Choisissez un produit et une quantité.</div>';return;}
  const rows=needs(pid,n),miss=rows.filter(r=>r.miss>0);
  box.innerHTML='<div class="sep"></div><table><thead><tr><th>Ingrédient</th><th class="right">Nécessaire</th><th class="right">Disponible</th><th class="right">Manquant</th></tr></thead><tbody>'+
   rows.map(r=>'<tr><td>'+esc(r.name)+'</td><td class="right mono">'+fmt(r.need)+'</td><td class="right mono">'+fmt(r.av)+'</td>'+
   '<td class="right mono" style="color:'+(r.miss>0?'var(--rouge)':'var(--vert)')+'"><b>'+fmt(r.miss)+'</b></td></tr>').join('')+'</tbody></table>'+
   (miss.length?'<div class="fiche" style="border-color:var(--rouge);margin-top:9px"><b style="color:var(--rouge)">Ingrédients insuffisants</b><div class="small">'+miss.map(m=>esc(m.name)+' : il manque <b>'+fmt(m.miss)+'</b>').join('<br>')+'</div><label class="chk" style="margin-top:7px"><input type="checkbox" id="fForce">Forcer malgré tout (stock négatif assumé)</label></div>'
   :'<div class="fiche" style="border-color:var(--vert);margin-top:9px"><b style="color:var(--vert)">✓ Tous les ingrédients sont disponibles.</b></div>');
}
function doProduce(){
  const pid=val('fP'),n=Math.max(0,num(val('fN')));
  if(!pid||!n)return toast('Produit et quantité requis');
  const force=chk('fForce');
  const res=craftEngine(pid,n,{force,source:'Recettes'});
  if(!res.ok){toast('Ingrédients insuffisants — cochez « Forcer » pour passer outre');return;}
  closeM();closeD();toast(n+'× '+PN(pid)+' produit(s)');render();
}
function sendToAtelier(pid,qty0,orderRef){
  const q=qty0||prompt('Quantité à envoyer en Atelier pour « '+PN(pid)+' » :','1');
  const n=num(q);if(!n||n<=0)return;
  const num_=String(DB.settings.nextAte++).padStart(4,'0');
  const order={id:uid('at'),num:'#'+num_,pid,qty:n,status:'En attente',alchimiste:DB.settings.practitioner||'',ts:Date.now(),orderRef:orderRef||'',cost:0,doneTs:null};
  DB.atelier.unshift(order);
  if(orderRef){const o=DB.orders.find(x=>x.id===orderRef);if(o){if(!Array.isArray(o.atelierOrders))o.atelierOrders=[];o.atelierOrders.push(order.id);}}
  jr('Atelier','Ordre '+order.num+' créé — '+PN(pid)+' ×'+fmt(n),0,'atelier',order.id);
  toast('Ordre '+order.num+' envoyé à l\'Atelier');
  save();
  if(page==='atelier')render();
  return order;
}

/* ═══════════ 9b. ATELIER (moteur commun avec Recettes) ═══════════ */
let atF={bucket:'active',alch:'',mine:false};
function atInBucket(o,b){
  if(b==='active')return o.status==='En attente'||o.status==='En cours';
  if(b==='attente')return o.status==='En attente';
  if(b==='cours')return o.status==='En cours';
  if(b==='termine')return o.status==='Terminé';
  if(b==='annule')return o.status==='Annulée'||o.status==='Impossible';
  return true;
}
function vAtelier(){
  document.getElementById('topAct').innerHTML='<button class="b-or" onclick="openNewAtelier()">+ Nouvel ordre</button>';
  const all=DB.atelier;
  const counts={active:0,attente:0,cours:0,termine:0,annule:0,all:all.length};
  all.forEach(o=>{['active','attente','cours','termine','annule'].forEach(b=>{if(atInBucket(o,b))counts[b]++;});});
  const alchs=[...new Set(all.map(o=>o.alchimiste).filter(Boolean))];

  let l=all.filter(o=>atInBucket(o,atF.bucket));
  if(atF.alch)l=l.filter(o=>o.alchimiste===atF.alch);
  if(atF.mine)l=l.filter(o=>o.alchimiste===DB.settings.practitioner);
  l=l.slice().sort((a,b)=>b.ts-a.ts);

  const chip=(b,label)=>'<button class="'+(atF.bucket===b?'b-or':'')+'" onclick="atF.bucket=\''+b+'\';vAtelier()">'+label+' <span class="tag t-n" style="margin-left:4px">'+counts[b]+'</span></button>';

  let h='<div class="row" style="margin-bottom:10px;justify-content:space-between">';
  h+='<div class="row">'+chip('active','Actifs')+chip('attente','En attente')+chip('cours','En cours')+chip('termine','Terminés')+chip('annule','Annulés')+chip('all','Tous')+'</div>';
  h+='<div class="row">';
  h+='<select style="width:170px" onchange="atF.alch=this.value;vAtelier()"><option value="">Tous les alchimistes</option>'+alchs.map(a=>'<option'+(atF.alch===a?' selected':'')+'>'+esc(a)+'</option>').join('')+'</select>';
  h+='<button class="'+(atF.mine?'b-or':'')+'" onclick="atF.mine=!atF.mine;vAtelier()">Mes OF</button>';
  h+='</div></div>';

  h+='<div class="pan"><table><thead><tr><th style="width:26px"></th><th style="width:26px"></th><th>N°</th><th>Objet</th><th class="right">Qté</th><th>Statut</th><th>Faisable</th><th>Alchimiste</th><th>Créé</th><th class="right">Actions</th></tr></thead><tbody>';
  if(!l.length)h+='<tr><td colspan="10" class="empty">Aucun ordre dans cette vue</td></tr>';
  l.forEach(o=>{
    const rows=needs(o.pid,o.qty),miss=rows.filter(r=>r.miss>0);
    const cost=rows.reduce((a,r)=>{const ip=P(r.pid);return a+(ip?num(ip.buyPrice):0)*r.need;},0);
    const feasible=miss.length===0;
    const canAct=(o.status==='En attente'||o.status==='En cours'||o.status==='Impossible');
    let act='';
    if(canAct){
      if(o.status==='En attente')act+='<button class="b-s" onclick="event.stopPropagation();setAtelierStatus(\''+o.id+'\',\'En cours\')">Démarrer</button> ';
      act+='<button class="b-s b-or" onclick="event.stopPropagation();launchAtelier(\''+o.id+'\')">Fabriquer</button> ';
      act+='<button class="b-s b-r" onclick="event.stopPropagation();cancelAtelier(\''+o.id+'\')">Annuler</button>';
    }
    h+='<tr class="clk" onclick="toggleAt(\''+o.id+'\')">'+
      '<td><input type="checkbox" onclick="event.stopPropagation()"></td>'+
      '<td id="chev-'+o.id+'" style="color:var(--tx2)">▸</td>'+
      '<td><b>'+esc(o.num)+'</b></td>'+
      '<td><span class="tag '+FCL[P(o.pid)?P(o.pid).family:'Autre']+'">'+esc(PN(o.pid))+'</span></td>'+
      '<td class="right mono">'+fmt(o.qty)+'</td>'+
      '<td>'+atStatusTag(o.status)+'</td>'+
      '<td>'+(feasible?'<span style="color:var(--vert)">✓ oui</span>':'<span style="color:var(--rouge)">✗ manque '+miss.length+'</span>')+'</td>'+
      '<td class="muted">'+(o.alchimiste?esc(o.alchimiste):'—')+'</td>'+
      '<td class="tiny muted">'+dt(o.ts)+'</td>'+
      '<td class="right" style="white-space:nowrap">'+act+(o.orderRef&&DB.orders.find(x=>x.id===o.orderRef)?' <button class="b-i" title="Voir la commande" onclick="event.stopPropagation();editOrder(\''+o.orderRef+'\')">📜</button>':'')+'</td></tr>';
    h+='<tr id="det-'+o.id+'" style="display:none"><td></td><td colspan="9" style="padding:0">'+
      '<div style="background:#100c08;padding:10px 14px;border-bottom:1px solid var(--line)">'+
      '<div class="row" style="justify-content:space-between;margin-bottom:6px"><b class="tiny" style="color:var(--tx2);letter-spacing:.4px">RECETTE — CE QUE LA FABRICATION VA CONSOMMER</b><span class="small">Coût de revient : <b style="color:var(--or2)">'+sp(cost)+'</b></span></div>'+
      '<table><tbody>'+
       '<tr><td><span class="tag '+FCL[P(o.pid)?P(o.pid).family:'Autre']+'">'+fmt(o.qty)+'×</span> '+esc(PN(o.pid))+'</td><td class="right"><span class="tag t-w">'+fmt(o.qty)+' à fabriquer</span></td><td class="right mono muted" style="width:110px">'+sp(cost)+'</td></tr>'+
       rows.map(r=>{
         const ip=P(r.pid),lineCost=(ip?num(ip.buyPrice):0)*r.need;
         return '<tr><td style="padding-left:22px">'+fmt(r.need)+'× '+esc(r.name)+'</td>'+
         '<td class="right">'+(r.miss>0?'<span class="tag t-d">'+fmt(r.miss)+' manquant</span>':'<span class="tag t-ok">'+fmt(r.av)+' du stock</span>')+'</td>'+
         '<td class="right mono muted" style="width:110px">'+sp(lineCost)+'</td></tr>';
       }).join('')+
      '</tbody></table>'+
      '<div class="tiny muted" style="margin-top:6px;font-style:italic">Simulé sur le stock actuel — un rachat ou une vente entre-temps peut changer ce tableau.</div>'+
      (miss.length?'<button class="b-s" style="margin-top:8px" onclick="prepAchatFromAtelier(\''+o.id+'\')">🛒 Préparer un achat pour le manquant</button>':'')+
      '</div></td></tr>';
  });
  h+='</tbody></table></div>';
  h+='<div class="small muted" style="margin-top:8px">1–'+l.length+' sur '+l.length+'</div>';
  document.getElementById('view').innerHTML=h;
}
function toggleAt(id){
  const row=document.getElementById('det-'+id),chev=document.getElementById('chev-'+id);
  if(!row)return;
  const open=row.style.display!=='none';
  row.style.display=open?'none':'table-row';
  chev.textContent=open?'▸':'▾';
}
function setAtelierStatus(id,st){
  const o=DB.atelier.find(x=>x.id===id);if(!o)return;
  o.status=st;jr('Atelier',o.num+' → '+st,0,'atelier',o.id);
  toast('Ordre '+st.toLowerCase());render();
}
function atStatusTag(s){
  const m={'En attente':'t-n','En cours':'t-b','Terminé':'t-ok','Impossible':'t-d','Annulée':'t-d'};
  return '<span class="tag '+(m[s]||'t-n')+'">'+esc(s)+'</span>';
}
function openNewAtelier(){
  const b='<div class="f"><label>Produit à fabriquer</label><select id="naP">'+
   '<option value="">— choisir —</option>'+DB.products.filter(p=>!p.archived&&p.recipe.length).map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join('')+'</select></div>'+
   '<div class="g g2"><div class="f"><label>Quantité</label><input id="naQ" value="1"></div>'+
   '<div class="f"><label>Alchimiste</label><input id="naA" value="'+esc(DB.settings.practitioner||'')+'"></div></div>';
  openM('+ Nouvel ordre Atelier',b,'<button class="b-or" onclick="confirmNewAtelier()">Créer l\'ordre</button><button onclick="closeM()">Annuler</button>',480);

function confirmNewAtelier(){
  const pid=val('naP'),n=num(val('naQ')),alch=val('naA');
  if(!pid||!n)return toast('Produit et quantité requis');
  closeM();
  const o=sendToAtelier(pid,n);
  if(o&&alch)o.alchimiste=alch;
  save();render();
}
function openAtelier(id){
  go('atelier');
  setTimeout(()=>{const row=document.getElementById('det-'+id);if(row){toggleAt(id);row.scrollIntoView({block:'center'});}},60);
}
function launchAtelier(id){
  const o=DB.atelier.find(x=>x.id===id);if(!o)return;
  if(o.status==='Terminé')return toast('Cet ordre a déjà été fabriqué');
  let force=false;
  const res0=craftEngine(o.pid,o.qty,{force:false,source:'Atelier',refId:o.id,reason:'atelier '+o.num});
  if(!res0.ok){
    if(!ask('Ingrédients insuffisants pour '+o.num+'. Forcer la fabrication malgré tout (stock négatif assumé) ?')){
      o.status='Impossible';save();render();return;
    }
    force=true;
  }
  const res=force?craftEngine(o.pid,o.qty,{force:true,source:'Atelier',refId:o.id,reason:'atelier '+o.num}):res0;
  o.status='Terminé';o.doneTs=Date.now();o.cost=res.cost;
  jr('Atelier','Ordre '+o.num+' terminé — '+PN(o.pid)+' ×'+fmt(o.qty),res.cost,'atelier',o.id);
  toast('Ordre '+o.num+' terminé');render();
}
function cancelAtelier(id){
  if(!ask('Annuler cet ordre de fabrication ?'))return;
  const o=DB.atelier.find(x=>x.id===id);
  if(o.status==='Terminé')return toast('Un ordre terminé ne peut plus être annulé');
  o.status='Annulée';
  jr('Atelier','Ordre '+o.num+' annulé',0,'atelier',o.id);
  toast('Ordre annulé');render();
}
function prepAchatFromAtelier(id){
  const o=DB.atelier.find(x=>x.id===id);if(!o)return;
  const rows=needs(o.pid,o.qty).filter(r=>r.miss>0);
  if(!rows.length)return toast('Aucun ingrédient manquant');
  editPurch();
  setTimeout(()=>{
    const box=document.getElementById('puLines');box.innerHTML='';
    rows.forEach(r=>{const p=P(r.pid);box.insertAdjacentHTML('beforeend',purLine({pid:r.pid,qty:r.miss,unit:p?p.buyPrice:0}));});
    calcPur();
  },50);
}

function savePat(id){
  const name=val('ptN').trim();if(!name)return toast('Le nom est obligatoire');
  let p=id?PAT(id):null;const isNew=!p;
  if(isNew){p={id:uid('pa'),archived:false,createdAt:Date.now()};DB.patients.push(p);}
  p.name=name;p.nickname=val('ptS');p.sex=val('ptX');p.race=val('ptR');p.age=val('ptA');p.job=val('ptJ');p.notes=val('ptNo');p.dead=chk('ptD');

function openPat(id){
  const p=PAT(id);if(!p)return;
  const cs=DB.consultations.filter(c=>c.patientId===id).sort((a,b)=>b.ts-a.ts);
  const iv=DB.invoices.filter(i=>i.patientId===id).sort((a,b)=>b.ts-a.ts);
  let b='<div class="fiche"><div class="row"><b style="font-size:15px">'+esc(p.name)+'</b>'+(p.dead?'<span class="tag t-d">décédé</span>':'')+'</div>'+
   '<div class="small muted">'+[p.nickname&&'« '+esc(p.nickname)+' »',p.race,p.sex,p.age&&p.age+' ans',p.job].filter(Boolean).join(' · ')+'</div>'+
   (p.notes?'<div class="sep"></div><div class="small">'+esc(p.notes).replace(/\n/g,'<br>')+'</div>':'')+'</div>';
  b+='<div class="row" style="margin-bottom:10px"><button class="b-or" onclick="editConsult(null,\''+id+'\')">✚ Nouvelle consultation</button><button onclick="editPat(\''+id+'\')">Modifier la fiche</button></div>';
  b+='<div class="small muted" style="margin-bottom:6px">Chronologie du dossier ('+cs.length+' consultation(s))</div><div class="tl">';
  const ev=cs.map(c=>({ts:c.ts,h:'<b>Consultation</b> — '+esc(c.motif||c.type||'—')+'<div class="tiny muted">'+esc(c.practitioner||'')+' · '+sp(c.price)+'</div>'+(c.diagnosis?'<div class="small">Dx : '+esc(c.diagnosis)+'</div>':''),cid:c.id}))

function ta(l,id,v,r){return '<div class="f"><label>'+l+'</label><textarea id="'+id+'" rows="'+(r||3)+'">'+esc(v||'')+'</textarea></div>';}
function cTab(el,id){el.parentElement.querySelectorAll('span').forEach(s=>s.classList.remove('on'));el.classList.add('on');['cf1','cf2','cf3','cf4'].forEach(i=>{const e=document.getElementById(i);if(e)e.style.display=i===id?'':'none';});}
function consItem(it){
  return '<div class="row citem" style="margin-bottom:5px;flex-wrap:nowrap"><select class="ci-p" style="flex:1" onchange="ciPrice(this)">'+prodOpts(it?it.pid:'')+'</select>'+
   '<input class="ci-q" value="'+(it?fmt(it.qty):1)+'" style="width:62px;text-align:center" oninput="calcCons()">'+
   '<input class="ci-u" value="'+(it?fmt(it.unit):0)+'" style="width:78px;text-align:right" oninput="calcCons()">'+
   '<button class="b-i b-r" onclick="this.parentElement.remove();calcCons()">✕</button></div>';
}
function addConsItem(){document.getElementById('cItems').insertAdjacentHTML('beforeend',consItem(null));}
function ciPrice(sel){const p=P(sel.value);if(p)sel.parentElement.querySelector('.ci-u').value=fmt(p.sellPrice||p.value);calcCons();}
function readConsItems(){
  const a=[];document.querySelectorAll('#cItems .citem').forEach(d=>{
    const pid=d.querySelector('.ci-p').value,q=num(d.querySelector('.ci-q').value),u=num(d.querySelector('.ci-u').value);
    if(pid&&q)a.push({pid,qty:q,unit:u});});
  return a;
}
function calcCons(){
  const e=document.getElementById('cTotal');if(!e)return;
  const base=num(val('cPrice')),items=readConsItems();
  const add=chk('cAdd')?items.reduce((a,i)=>a+i.qty*i.unit,0):0;
  e.value=fmt(base+add)+' '+DB.settings.currency;
}
function cartToConsult(){

function quickPat(){
  const nm=prompt('Nom du nouveau patient :');if(!nm)return;
  const p={id:uid('pa'),name:nm.trim(),nickname:'',sex:'',race:'',age:'',job:'',notes:'',dead:false,archived:false,createdAt:Date.now()};

function saveConsult(id){
  const patientId=val('cPat');
  if(!patientId)return toast('Sélectionnez un patient');
  let c=id?DB.consultations.find(x=>x.id===id):null;const isNew=!c;
  if(isNew){c={id:uid('c'),items:[],stockDone:false,invoiceId:''};DB.consultations.unshift(c);}
  const old=(c.items||[]).slice(),wasDone=c.stockDone;
  c.patientId=patientId;c.practitioner=val('cPra');c.ts=new Date(val('cDate')).getTime()||Date.now();
  c.service=val('cServ');c.type=val('cType');c.motif=val('cMotif');
  c.symptoms=val('cSym');c.observations=val('cObs');c.diagnosis=val('cDx');c.exams=val('cEx');c.injuries=val('cInj');c.state=val('cSt');
  c.care=val('cCare');c.meds=val('cMeds');c.treatment=val('cTr');c.reco=val('cReco');c.followup=val('cFu');
  c.items=readConsItems();c.addItems=chk('cAdd');c.price=num(val('cPrice'));c.paid=chk('cPaid');
  c.total=c.price+(c.addItems?c.items.reduce((a,i)=>a+i.qty*i.unit,0):0);
  if(wasDone)old.forEach(i=>mv(i.pid,i.qty,'Correction','annulation consultation',c.id));
  c.items.forEach(i=>take(i.pid,i.qty,'Consommation','consultation '+patName(patientId),c.id));
  c.stockDone=true;
  if(c.practitioner)DB.settings.practitioner=c.practitioner;
  jr('Consultation','Patient : '+patName(patientId)+(c.motif?' — '+c.motif:''),c.total,c.id);
  closeM();toast('Consultation enregistrée');render();
}
function delConsult(id){
  if(!ask('Supprimer cette consultation ? Les produits consommés seront rendus au stock.'))return;
  const c=DB.consultations.find(x=>x.id===id);
  if(c&&c.stockDone)(c.items||[]).forEach(i=>mv(i.pid,i.qty,'Correction','suppression consultation',c.id));
  DB.consultations=DB.consultations.filter(x=>x.id!==id);
  jr('Consultation','Suppression d\'une consultation');
  closeM();toast('Consultation supprimée');render();
}
function exportReport(id){
  const c=DB.consultations.find(x=>x.id===id);if(!c)return;
  const L1='═══════════════════════════════════════════════════════';
  const L2='───────────────────────────────────────────────────────';
  const prods=(c.items||[]).map(i=>'  • '+PN(i.pid)+' ×'+fmt(i.qty)).join('\n');
  let t=L1+'\n';
  t+='   RAPPORT D\'INTERVENTION — '+DB.settings.orgName.toUpperCase()+'\n';
  t+=L1+'\n\n';
  t+='Patient : '+patName(c.patientId)+'\n';
  t+='Praticien : '+(c.practitioner||'—')+'\n\n'+L2+'\n\n';
  t+='**Intervention :**\n'+dt(c.ts)+'\n\n';
  t+='**Prise en charge :**\n'+(c.service||'[Non renseigné]')+'\n\n';
  t+='**Motif :**\n'+(c.motif||'[Non renseigné]')+'\n\n';
  t+='**Rapport d\'intervention :**\n*'+([c.symptoms,c.observations,c.care,c.treatment,c.reco].filter(Boolean).join('\n\n')||'[Non renseigné]')+'*\n\n';
  t+='**Diagnostic :**\n'+(c.diagnosis||'[Non renseigné]')+'\n\n';
  t+='**Résultats d\'examens (si réalisé) :**\n'+(c.exams||'[Non renseigné]')+'\n\n';

  t+='**Factures prépayées :**\n'+sp(c.total||c.price)+'\n\n'+L1;
  dl(t,'Rapport_'+patName(c.patientId).replace(/\s+/g,'_')+'_'+new Date(c.ts).toISOString().slice(0,10)+'.txt');
  toast('Rapport exporté');
}
function dl(text,name,type){
  const b=new Blob([text],{type:type||'text/plain;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');
  a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500);
}
function consToInv(id){
  const c=DB.consultations.find(x=>x.id===id);if(!c)return;
  if(c.invoiceId&&DB.invoices.find(i=>i.id===c.invoiceId))return editInv(c.invoiceId);
  const lines=[{pid:'',label:(c.type||'Consultation')+(c.motif?' — '+c.motif:''),qty:1,unit:c.price,discount:0}];
  if(c.addItems)(c.items||[]).forEach(i=>lines.push({pid:i.pid,label:PN(i.pid),qty:i.qty,unit:i.unit,discount:0}));
  const inv=newInv({client:patName(c.patientId),patientId:c.patientId,lines,notes:'Consultation du '+dt(c.ts),stockDone:true});
  c.invoiceId=inv.id;
  jr('Facturation','Facture '+inv.num+' générée depuis une consultation',invTotal(inv),inv.id);
  closeM();toast('Facture '+inv.num+' créée');editInv(inv.id);

function addPayment(id){
  const i=DB.invoices.find(x=>x.id===id);if(!i)return;
  const amt=num(val('ivNewAmt'));if(!amt||amt<=0)return toast('Montant invalide');
  const rest=invRemain(i);
  if(amt>rest+0.001&&!ask('Ce paiement ('+fmt(amt)+') dépasse le reste dû ('+fmt(rest)+'). Continuer ?'))return;
  if(!i.payments)i.payments=[];
  i.payments.push({id:uid('pay'),amount:amt,ts:Date.now(),note:val('ivNewNote')});
  invRecalcStatus(i);
  jr('Facturation','Paiement de '+fmt(amt)+' '+DB.settings.currency+' sur '+i.num,amt,'invoice',i.id);
  toast('Paiement enregistré');
  editInv(id);
}
function invLine(l,free){
  const isFree=free||(l&&!l.pid);
  return '<div class="lines ivl" style="margin-bottom:5px">'+
   (isFree?'<input class="il-l" value="'+esc(l?l.label:'')+'" placeholder="Désignation libre">'
    :'<select class="il-p" onchange="ilPrice(this)">'+prodOpts(l?l.pid:'')+'</select>')+
   '<input class="il-q" value="'+(l?fmt(l.qty):1)+'" style="text-align:center" oninput="calcInv()">'+
   '<input class="il-u" value="'+(l?fmt(l.unit):0)+'" style="text-align:right" oninput="calcInv()">'+
   '<input class="il-d" value="'+(l?fmt(l.discount):0)+'" style="text-align:right" oninput="calcInv()">'+
   '<input class="il-t" readonly style="text-align:right">'+
   '<button class="b-i b-r" onclick="this.parentElement.remove();calcInv()">✕</button></div>';
}
function addInvLine(free){document.getElementById('ivLines').insertAdjacentHTML('beforeend',invLine(null,free));calcInv();}
function ilPrice(sel){const p=P(sel.value);if(p)sel.parentElement.querySelector('.il-u').value=fmt(p.sellPrice||p.value);calcInv();}
function readInvLines(){
  const a=[];document.querySelectorAll('#ivLines .ivl').forEach(d=>{
    const ps=d.querySelector('.il-p'),ls=d.querySelector('.il-l');
    const pid=ps?ps.value:'';const label=ls?ls.value:(pid?PN(pid):'');
    const q=num(d.querySelector('.il-q').value),u=num(d.querySelector('.il-u').value),di=num(d.querySelector('.il-d').value);
    if((pid||label)&&q)a.push({pid,label,qty:q,unit:u,discount:di});});
  return a;
}
function calcInv(){
  let tot=0;
  document.querySelectorAll('#ivLines .ivl').forEach(d=>{
    const t=Math.max(0,num(d.querySelector('.il-q').value)*num(d.querySelector('.il-u').value)-num(d.querySelector('.il-d').value));
    d.querySelector('.il-t').value=fmt(t);tot+=t;});
  const e=document.getElementById('ivTot');if(!e)return;
  e.textContent=sp(tot);
  const pe=document.getElementById('ivPaid');
  if(pe){
    const idAttr=document.querySelector('[onclick^="saveInv"]');
    const m=idAttr&&idAttr.getAttribute('onclick').match(/saveInv\('([^']*)'\)/);
    const cur=m&&m[1]?DB.invoices.find(x=>x.id===m[1]):null;
    const paid=cur?invPaid(cur):0;
    pe.textContent=sp(paid);
    document.getElementById('ivRest').textContent=sp(Math.max(0,tot-paid));
  }
}
function linkPat(){const p=PAT(val('ivP'));if(p&&!val('ivC'))document.getElementById('ivC').value=p.name;}
function cartToInv(){
  if(!DB.cart.length)return toast('Le panier est vide');
  DB.cart.forEach(c=>document.getElementById('ivLines').insertAdjacentHTML('beforeend',invLine({pid:c.pid,label:PN(c.pid),qty:c.qty,unit:c.unit,discount:0})));
  DB.cart=[];save();renderNav();calcInv();toast('Panier ajouté');
}
function saveInv(id){
  let i=id?DB.invoices.find(x=>x.id===id):null;const isNew=!i;
  const lines=readInvLines();
  if(!lines.length)return toast('Ajoutez au moins une ligne');
  if(isNew)i=newInv({});
  const wasDone=i.stockDone,old=i.lines.slice();
  i.client=val('ivC');i.patientId=val('ivP');i.org=val('ivO');
  i.lines=lines;i.method=val('ivM');i.notes=val('ivN');
  if(i.status==='Brouillon'&&val('ivS')==='Brouillon'){ /* reste brouillon tant qu'aucun paiement/validation */ }
  invRecalcStatus(i);
  const tot=invTotal(i);
  const wantStock=document.getElementById('ivStk')?chk('ivStk'):wasDone;
  if(i.status!=='Brouillon'&&i.status!=='Annulé'&&wantStock){
    if(wasDone)old.filter(l=>l.pid).forEach(l=>mv(l.pid,l.qty,'Correction','révision facture '+i.num,i.id));
    i.lines.filter(l=>l.pid).forEach(l=>take(l.pid,l.qty,'Vente','facture '+i.num,i.id));
    i.stockDone=true;
  }
  jr('Facturation','Facture '+i.num+' — '+(i.client||'client')+' ('+i.status+')',tot,'invoice',i.id);
  closeM();toast('Facture '+i.num+' enregistrée');render();
}
function dupInv(id){
  const s=DB.invoices.find(x=>x.id===id);if(!s)return;
  const i=newInv({client:s.client,patientId:s.patientId,org:s.org,lines:JSON.parse(JSON.stringify(s.lines)),notes:s.notes,method:s.method,status:'Brouillon'});
  jr('Facturation','Duplication de '+s.num+' → '+i.num,0,'invoice',i.id);
  closeM();toast('Facture '+i.num+' créée');editInv(i.id);
}
function cancelInv(id){
  if(!ask('Annuler cette facture ? Les articles déjà déduits seront rendus au stock.'))return;
  const i=DB.invoices.find(x=>x.id===id);
  if(i.stockDone){i.lines.filter(l=>l.pid).forEach(l=>mv(l.pid,l.qty,'Correction','annulation '+i.num,i.id));i.stockDone=false;}
  i.status='Annulé';jr('Facturation','Annulation de '+i.num,0,'invoice',i.id);
  closeM();toast('Facture annulée');render();
}
function invText(i){
  const L='───────────────────────────────────────────────';
  let t=DB.settings.orgName.toUpperCase()+'\nFACTURE '+i.num+'\n'+dt(i.ts)+'\n\n';
  t+='Client : '+(i.client||'—')+'\n'+(i.org?'Organisation : '+i.org+'\n':'')+'\n'+L+'\n';
  i.lines.forEach(l=>{t+=(l.label||PN(l.pid))+'\n   '+fmt(l.qty)+' × '+fmt(l.unit)+(l.discount?' − '+fmt(l.discount):'')+' = '+sp(lineTotal(l))+'\n';});
  t+=L+'\nTOTAL : '+sp(invTotal(i))+'\nPayé : '+sp(invPaid(i))+'\nReste : '+sp(invRemain(i))+'\nStatut : '+i.status+'\nPaiement : '+i.method+'\n';
  if(i.notes)t+='\nNotes : '+i.notes+'\n';
  return t;
}
function exportInv(id){const i=DB.invoices.find(x=>x.id===id);dl(invText(i),i.num+'.txt');toast('Facture exportée');}
function printInv(id){
  const i=DB.invoices.find(x=>x.id===id);if(!i)return;
  document.getElementById('print').innerHTML='<h1>'+esc(DB.settings.orgName)+'</h1>'+
   '<p class="mt"><b>Facture '+esc(i.num)+'</b> — '+dt(i.ts)+'<br>Client : '+esc(i.client||'—')+(i.org?'<br>'+esc(i.org):'')+'</p>'+
   '<table><thead><tr><th>Désignation</th><th>Qté</th><th>P.U.</th><th>Remise</th><th>Total</th></tr></thead><tbody>'+
   i.lines.map(l=>'<tr><td>'+esc(l.label||PN(l.pid))+'</td><td>'+fmt(l.qty)+'</td><td>'+fmt(l.unit)+'</td><td>'+fmt(l.discount)+'</td><td>'+fmt(lineTotal(l))+'</td></tr>').join('')+
   '</tbody></table><div class="tot">Total : '+sp(invTotal(i))+'</div>'+
   '<p class="mt">Payé : '+sp(invPaid(i))+' — Reste : '+sp(invRemain(i))+' — '+esc(i.status)+'<br>Paiement : '+esc(i.method)+'</p>'+
   (i.notes?'<p class="mt">'+esc(i.notes)+'</p>':'')+
   '<p class="mt" style="margin-top:26px;font-style:italic">Que les Divins vous gardent en bonne santé.</p>';

function openCart(){

   DB.cart.map((c,i)=>'<tr><td>'+esc(PN(c.pid))+'</td>'+

   '<td class="right"><input value="'+fmt(c.unit)+'" style="width:74px;text-align:right" onchange="DB.cart['+i+'].unit=num(this.value);save();openCart()"></td>'+

   '</tbody></table><div class="fiche row" style="justify-content:space-between;margin-top:9px"><b>TOTAL</b><b style="color:var(--or2)">'+sp(DB.cart.reduce((a,c)=>a+c.qty*c.unit,0))+'</b></div>'+
   '<div class="sep"></div><div class="small muted" style="margin-bottom:6px">Envoyer le panier vers :</div>'+
   '<div class="row"><button class="b-or" onclick="cartTo(\'inv\')">🧾 Facture</button><button onclick="cartTo(\'sale\')">💰 Vente directe</button>'+
   '<button onclick="cartTo(\'consult\')">✚ Consultation</button><button onclick="cartTo(\'order\')">📜 Commande</button></div>'
   :'<div class="empty">Le panier est vide.<br><span class="small">Ajoutez des produits depuis le stock ou les recettes.</span></div>';
  openD('🧺 Panier',b,DB.cart.length?'<button class="b-r" onclick="DB.cart=[];save();openCart();renderNav()">Vider</button>':'');
}
function cartTo(dest){
  if(!DB.cart.length)return;
  const lines=DB.cart.map(c=>({pid:c.pid,label:PN(c.pid),qty:c.qty,unit:c.unit,discount:0}));
  closeD();
  if(dest==='inv'){const i=newInv({lines,status:'Brouillon'});DB.cart=[];save();editInv(i.id);}
  else if(dest==='order'){const o={id:uid('o'),num:'C-'+String(DB.settings.nextOrd++).padStart(4,'0'),ts:Date.now(),client:'',lines:DB.cart.map(c=>({pid:c.pid,qty:c.qty,unit:c.unit})),deposit:0,notes:'',wanted:'',status:'Demande'};DB.orders.unshift(o);DB.cart=[];save();editOrder(o.id);}
  else if(dest==='consult'){editConsult();setTimeout(()=>{const box=document.getElementById('cItems');DB.cart.forEach(c=>box.insertAdjacentHTML('beforeend',consItem(c)));DB.cart=[];save();renderNav();calcCons();},60);}
  else if(dest==='sale'){
    const i=newInv({client:'Vente comptoir',lines,status:'Payé',paidAmount:lines.reduce((a,l)=>a+lineTotal(l),0)});
    lines.forEach(l=>take(l.pid,l.qty,'Vente','vente comptoir '+i.num,i.id));i.stockDone=true;
    jr('Vente','Comptoir — '+lines.map(l=>l.label+'×'+fmt(l.qty)).join(', '),invTotal(i),i.id);
    DB.cart=[];save();toast('Vente enregistrée ('+i.num+')');render();
  }
}

/* ═══════════ 17. STATISTIQUES ═══════════ */
let sPer=30;
function treasuryNow(){return num(DB.settings.treasuryInit)+ca()-dep();}
function situationLabel(v){if(v>0.01)return{t:'Situation positive',c:'var(--vert)'};if(v<-0.01)return{t:'Déficit',c:'var(--rouge)'};return{t:'À l\'équilibre',c:'var(--jaune)'};}
function financeSeries(days){
  const now=Date.now();
  let from;
  if(!days){
    const allTs=[].concat(DB.invoices.flatMap(i=>(i.payments||[]).map(p=>p.ts)),DB.purchases.map(p=>p.ts));
    from=allTs.length?Math.min.apply(null,allTs):now;
  }else from=now-days*864e5;
  const buckets={};
  const dayKey=ts=>new Date(ts).toISOString().slice(0,10);
  DB.invoices.forEach(i=>(i.payments||[]).forEach(p=>{if(p.ts>=from){const k=dayKey(p.ts);buckets[k]=buckets[k]||{r:0,d:0};buckets[k].r+=num(p.amount);}}));
  DB.purchases.forEach(p=>{if(p.ts>=from){const k=dayKey(p.ts);buckets[k]=buckets[k]||{r:0,d:0};buckets[k].d+=num(p.total);}});
  const keys=Object.keys(buckets).sort();
  let cum=0;
  return keys.map(k=>{const b=buckets[k];const res=b.r-b.d;cum+=res;return{date:k,r:b.r,d:b.d,res,cum};});
}
function renderFinanceSVG(series){
  if(!series.length)return '<div class="empty">Aucune donnée disponible pour cette période.</div>';
  const W=680,H=170,pad=24;
  const maxV=Math.max(1,...series.map(s=>Math.abs(s.cum)));
  const xx=i=>pad+i*((W-2*pad)/Math.max(1,series.length-1));
  const yy=v=>H/2-(v/maxV)*(H/2-14);
  const pts=series.map((s,i)=>xx(i)+','+yy(s.cum)).join(' ');
  let svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:170px">';
  svg+='<line x1="'+pad+'" y1="'+yy(0)+'" x2="'+(W-pad)+'" y2="'+yy(0)+'" stroke="var(--line2)" stroke-dasharray="4,4"/>';
  svg+='<polyline fill="none" stroke="var(--or2)" stroke-width="2" points="'+pts+'"/>';
  series.forEach((s,i)=>{svg+='<circle cx="'+xx(i)+'" cy="'+yy(s.cum)+'" r="3" fill="'+(s.cum>=0?'var(--vert)':'var(--rouge)')+'"/>';});
  svg+='</svg>';
  return svg;
}
function vStats(){
  const from=sPer?Date.now()-sPer*864e5:0;
  const inv=DB.invoices.filter(i=>i.ts>=from&&i.status!=='Annulé'&&i.status!=='Brouillon');
  const cons=DB.consultations.filter(c=>c.ts>=from);
  const pur=DB.purchases.filter(p=>p.ts>=from);
  const revenue=inv.reduce((a,i)=>a+invPaid(i),0), spent=pur.reduce((a,p)=>a+num(p.total),0);
  const sold={},prod={},used={};
  inv.forEach(i=>i.lines.filter(l=>l.pid).forEach(l=>sold[l.pid]=(sold[l.pid]||0)+num(l.qty)));
  DB.movements.filter(m=>m.ts>=from).forEach(m=>{
    if(m.type==='Production'&&m.qty>0)prod[m.pid]=(prod[m.pid]||0)+m.qty;
    if((m.type==='Production'||m.type==='Consommation')&&m.qty<0)used[m.pid]=(used[m.pid]||0)-m.qty;
  });
  const top=(o,n)=>{const k=Object.keys(o).sort((a,b)=>o[b]-o[a]).slice(0,n);return k.length?'<table><tbody>'+k.map(id=>'<tr class="clk" onclick="openProd(\''+id+'\')"><td>'+esc(PN(id))+'</td><td class="right mono">'+fmt(o[id])+'</td><td style="width:90px"><div class="bar"><i style="width:'+(o[id]/o[k[0]]*100)+'%"></i></div></td></tr>').join('')+'</tbody></table>':'<div class="empty">—</div>';};
  const kpi=(k,v,d)=>'<div class="kpi"><div class="k">'+k+'</div><div class="v">'+v+'</div><div class="d">'+(d||'')+'</div></div>';
  let h='<div class="pan pad row" style="margin-bottom:10px">'+[[1,'Aujourd\'hui'],[7,'7 jours'],[30,'30 jours'],[90,'90 jours'],[0,'Tout']]
   .map(p=>'<button class="'+(sPer===p[0]?'b-or':'')+'" onclick="sPer='+p[0]+';vStats()">'+p[1]+'</button>').join('')+'</div>';
  const fin=financeSeries(sPer);
  const totR=fin.reduce((a,s)=>a+s.r,0),totD=fin.reduce((a,s)=>a+s.d,0),resPeriod=totR-totD,treas=treasuryNow(),sit=situationLabel(resPeriod);
  h+='<div class="pan" style="margin-bottom:12px"><div class="ph">💰 Santé financière<div class="sp"></div><span class="tag" style="border-color:'+sit.c+';color:'+sit.c+'">'+sit.t+'</span></div><div class="pad">'+
   renderFinanceSVG(fin)+
   '<div class="g g4" style="margin-top:10px">'+
    kpi('Recettes encaissées (période)',fmt(totR))+kpi('Dépenses (période)',fmt(totD))+kpi('Résultat (période)',fmt(resPeriod))+kpi('Trésorerie actuelle',fmt(treas))+
   '</div>'+(treas<0?'<div class="small" style="color:var(--rouge);margin-top:6px">⚠ Trésorerie négative</div>':'')+
   '<div class="tiny muted" style="margin-top:8px">Valeurs réelles uniquement (paiements et achats) — jamais les valeurs théoriques de Stock ou Tarifs.</div>'+
   '</div></div>';
  h+='<div class="g g4" style="margin-bottom:12px">'+kpi('Chiffre d\'affaires',fmt(revenue))+kpi('Dépenses',fmt(spent))+kpi('Bénéfice',fmt(revenue-spent))+
   kpi('Consultations',cons.length)+kpi('Factures',inv.length)+kpi('Achats',pur.length)+'</div>';
  h+='<div class="g g2">'+
   '<div class="pan"><div class="ph">Articles les plus vendus</div>'+top(sold,8)+'</div>'+
   '<div class="pan"><div class="ph">Produits les plus fabriqués</div>'+top(prod,8)+'</div>'+
   '<div class="pan"><div class="ph">Ingrédients les plus consommés</div>'+top(used,8)+'</div>'+
   '<div class="pan"><div class="ph">Produits en alerte</div>'+
    (()=>{const l=DB.products.filter(p=>!p.archived&&stStatus(p.id)!=='ok');return l.length?'<table><tbody>'+l.slice(0,8).map(p=>'<tr class="clk" onclick="openProd(\''+p.id+'\')"><td>'+esc(p.name)+'</td><td class="right mono">'+fmt(qty(p.id))+'</td><td style="width:90px">'+stateTag(p)+'</td></tr>').join('')+'</tbody></table>':'<div class="empty">Aucun</div>';})()+'</div></div>';
  document.getElementById('view').innerHTML=h;
}

/* ═══════════ 18. PARAMETRES / SAUVEGARDES ═══════════ */
function vSettings(){
  document.getElementById('topAct').innerHTML='';
  const s=DB.settings;
  let h='<div class="g g2"><div class="pan"><div class="ph">⚙ Général</div><div class="pad">'+
   '<div class="f"><label>Nom de l\'officine</label><input id="stOrg" value="'+esc(s.orgName)+'"></div>'+
   '<div class="f"><label>Praticien par défaut</label><input id="stPra" value="'+esc(s.practitioner)+'"></div>'+
   '<div class="g g2"><div class="f"><label>Monnaie</label><input id="stCur" value="'+esc(s.currency)+'"></div>'+
   '<div class="f"><label>Tarif consultation</label><input id="stCon" value="'+fmt(s.consultPrice)+'"></div></div>'+
   '<label class="chk"><input type="checkbox" id="stAdd" '+(s.addProductsToConsult?'checked':'')+'>Ajouter par défaut le prix des produits à la consultation</label>'+
   '<div class="f" style="margin-top:9px"><label>Trésorerie initiale</label><input id="stTres" value="'+fmt(s.treasuryInit||0)+'"></div>'+
   '<div class="sep"></div><button class="b-or" onclick="saveSettings()">Enregistrer</button></div></div>';
  h+='<div class="pan"><div class="ph">💾 Sauvegardes</div><div class="pad">'+
   '<div class="small muted" style="margin-bottom:9px">Les données sont enregistrées automatiquement à chaque opération. Exportez régulièrement un fichier de sauvegarde.</div>'+
   '<div class="row"><button class="b-or" onclick="exportAll()">⬇ Exporter toutes les données</button>'+
   '<button onclick="document.getElementById(\'impF\').click()">⬆ Importer une sauvegarde</button>'+
   '<input type="file" id="impF" accept=".json" style="display:none" onchange="importAll(this)"></div>'+
   '<div class="sep"></div><div class="small muted">Dernier enregistrement : '+(DB.savedAt?dt(DB.savedAt):'—')+'</div>'+
   '<div class="small muted">'+DB.products.length+' produits · '+DB.patients.length+' patients · '+DB.consultations.length+' consultations · '+DB.invoices.length+' factures · '+DB.atelier.length+' ordres Atelier · '+DB.movements.length+' mouvements</div>'+
   '</div></div>';
  h+='<div class="pan" style="margin-top:10px;border-color:var(--rouge)"><details><summary style="cursor:pointer;padding:8px 12px;font-weight:600;color:var(--rouge);border-bottom:1px solid var(--line)">⚠ Zone dangereuse</summary><div class="pad">'+
   '<p class="small muted" style="margin-bottom:9px">La réinitialisation efface définitivement toutes les données de l\'officine : produits, stock, patients, factures, consultations, journal. Cette action est irréversible.</p>'+
   '<button class="b-or" onclick="exportAll()" style="margin-bottom:9px">⬇ Exporter une sauvegarde avant de continuer</button>'+
   '<div class="sep"></div><div class="f"><label>Tapez REINITIALISER pour activer le bouton</label><input id="resetConfirm" oninput="document.getElementById(\'resetBtn\').disabled=(this.value!==\'REINITIALISER\')"></div>'+
   '<button class="b-r" id="resetBtn" disabled onclick="resetAll()">Réinitialiser complètement l\'officine</button>'+
   '</div></details></div>';
  h+='<div class="pan" style="margin-top:10px"><div class="ph">🗄 Éléments archivés</div><div class="pad">'+
   (()=>{const ap=DB.products.filter(p=>p.archived),aq=DB.patients.filter(p=>p.archived);
     if(!ap.length&&!aq.length)return '<div class="muted small">Aucun élément archivé.</div>';
     return ap.map(p=>'<div class="row"><span>📦 '+esc(p.name)+' <span class="muted small">('+fmt(qty(p.id))+' en stock)</span></span><button class="b-s" onclick="unarch(\'p\',\''+p.id+'\')">Restaurer</button></div>').join('')+
       aq.map(p=>'<div class="row"><span>☥ '+esc(p.name)+'</span><button class="b-s" onclick="unarch(\'a\',\''+p.id+'\')">Restaurer</button></div>').join('');})()+'</div></div>';
  document.getElementById('view').innerHTML=h;
}
function unarch(t,id){(t==='p'?P(id):PAT(id)).archived=false;toast('Restauré');render();}
function saveSettings(){
  DB.settings.orgName=val('stOrg');DB.settings.practitioner=val('stPra');
  DB.settings.currency=val('stCur')||'septims';DB.settings.consultPrice=num(val('stCon'));
  DB.settings.addProductsToConsult=chk('stAdd');DB.settings.treasuryInit=num(val('stTres'));
  toast('Paramètres enregistrés');render();
}
function exportAll(){
  dl(JSON.stringify(DB,null,1),'officine_sauvegarde_'+new Date().toISOString().slice(0,10)+'.json','application/json');
  jr('Système','Export de sauvegarde');toast('Sauvegarde exportée');save();
}
function importAll(input){
  const f=input.files[0];if(!f)return;
  if(!ask('Importer cette sauvegarde ? Toutes les données actuelles seront remplacées.')){input.value='';return;}
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d||!d.products)throw 0;
      DB=migrate(d);jr('Système','Import d\'une sauvegarde');
      save();render();toast('Sauvegarde importée');
    }catch(e){toast('Fichier invalide');}
    input.value='';
  };
  r.readAsText(f);
}
function resetAll(){
  if(!ask('Tout effacer et repartir d\'une base vierge ? Cette action est irréversible.'))return;
  if(!ask('Dernière confirmation : toutes vos données seront perdues.'))return;
  DB=seed(blank());save();render();toast('Application réinitialisée');
}

/* ═══════════ 19. DEMARRAGE ═══════════ */
(async function(){
  const allowed=await authBoot();
  if(!allowed)return;
  let raw=null;
  try{raw=await Store.get(KEY);}catch(e){}
  let parsed=null;
  try{parsed=raw?JSON.parse(raw):null;}catch(e){parsed=null;}
  const wasOld=parsed&&(parsed.version||0)<3;
  DB=migrate(parsed);
  if(!parsed)jr('Système','Première ouverture de l\'officine');
  else if(wasOld)jr('Système','Migration : fusion Catalogue + Stock, emplacements repliés en une quantité unique');
  render();
})();
window.addEventListener('keydown',e=>{if(e.key==='Escape'){closeM();closeD();}});
